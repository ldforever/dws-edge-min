<?xml version="1.0" encoding="GB2312" standalone="yes"?>
<Cfgs>
  <!--双目相机类型 camType: 1 华睿双目-->
  <IraypleCamCfg camType="1">
    <!--华睿双目相机属性 triggerMode: 0自由拉流 1硬触发 2软触发 enableNtpSync:NTP时间同步使能 timeSyncRate:NTP同步间隔(ms) cameraSn:相机序列号 cameraResolution:彩色相机分辨率 320x256 640x512 1280x1024 (三选一) cameraResolutionDepth:深度相机分辨率 320x256 640x512 1280x1024 (三选一)  -->
    <HuarayCam triggerMode="1" enableNtpSync="1" timeSyncRate="10000" cameraSn="" cameraResolution="640x512" cameraResolutionDepth="640x512"/>
	<!--保存图像、内参 enable:0关1开 ImageSavePath:存图路径-->
	<SaveImage enable="0" ImageSavePath="D:/Images"/>
  </IraypleCamCfg>
  <AlgCfg>
    <!--包裹类型识别算法配置 enable:包裹类型识别使能开关 0-关闭，1-开启-->
    <!-- runMode:算法检测模式1-双回流包裹计数及出双检测；2-单回流包裹计数及出双检测；3-单张彩色图像包裹出双检测；4-包裹计数；5-科捷交叉带出双检测；6-爬坡视觉定位模式；7-3D相机单帧触发出双检测; -->
	<!-- algMode:AI[0] 扁平件[1] -->
    <AbPackDet enable="1" runMode="7" algMode="0" velocity="1.8" depthImgSampleFactor="7" partReplenishDiffPackNum="10" allReplenishDiffPackNum="30" shuangHuiLiuMode="2" shuangHuiLiuUpLineNum="2" shuangHuiLiuDownLineNum="1" enableNtpSync="1" huiLiuAbnormalPack="1" localSegmentFiledSize="30" localSegmentThresh="30" minLength="80" minWidth="50" minHeight="0" midRegionWidth="330" minPackDistance="200" replenishStopTime="0" replenishStatisticsTime="30" peakEfficiencyStatisticsTime="20" rotateSuccessAngleBia="15" shuangHuiLiuMode12MinAbPackDis="400" maxHeight="550" maxLength="1000" maxWidth="1000" minRotatePackLength="300" maxOverlapPackDistance="50" maxRotateFailedSize="10000" midRegionMinPackDis="300" conveyorStartDelayTime="0" triggerPos="1130" shuangHuiLiuUpDownLineNumRatio="2.5" bailunWidth="200" bailunHeight="300" />
	<!--扁平件模式配置 rectangularityEnable:翘边使能1开0关 rectangularityThreshold:矩形度阈值[0,1]越靠近1矩形度越高 edgeWarpingHeightThreshold:高低差(边缘-中心)阈值  如果包裹高低差高于edgeWarpingHeightThreshold则判定为翘边件-->
	<BPJModeCfg rectangularityEnable="0" rectangularityThreshold="0.9" edgeWarpingHeightThreshold="20"/>
  </AlgCfg>
</Cfgs>
