# DWS Edge Min 采集宿主配置
#
# 宿主只认 [runtime] 段和"被选中 provider 的同名配置段"；每个 provider 自己解释自己的段，
# 核心层不认识任何厂商参数。

[runtime]
# 用哪个 provider（对应 providers 目录里工厂声明的 ProviderId）
provider=dahua-dws

[dahua-dws]
# 大华 SDK 配置文件（相对 runtime 目录；GB2312 编码，由大华 SDK 读取）
cfgPath=Cfg\LogisticsBase.cfg

# 图片落盘目录（相对 runtime 目录）
imageDir=images

# 保存哪些图
saveOriginal=true
saveWaybill=true

# 是否保存"每台相机各自的图"（需要 attachAllCameraCodeInfo=true，磁盘 I/O 会明显增加）
savePerCamera=false
attachAllCameraCodeInfo=false

# 回调入队缓冲：满了丢事件并告警，绝不反压 SDK 回调
queueCapacity=256

[spool]
# 规范事件写成本地 JSONL（将来换成 gRPC 推给业务层 / ARM 盒子）
enabled=true

# ---- 存图保留策略（与厂商无关，采集宿主统一执行）----
[storage]
# 图片目录：留空表示沿用 provider 段里的 imageDir
imageDir=
# 保存天数：超过这个天数的日期目录会被整目录删除；0 = 永久保留（不按天数删）
retentionDays=7
# 存图磁盘占用上限（%）：达到后从最旧的日期目录开始删；0 = 不启用磁盘水位保护
maxDiskPercent=85
# 清理线程运行间隔（分钟）
cleanupIntervalMinutes=30
# 采集宿主启动时先清理一次
cleanupOnStart=true
# spool 事件文件保留天数：0=永久保留。
# 只有业务平台写过消费标记（spool\.consumed）之后才会删，平台没消费过就不删。
spoolRetentionDays=7

# ---- 测试环境的软触发开关 ----
# 说明：
#   * 真机（provider=dahua-dws）要先把 SDK 配置改成软触发模式：
#       <ReadCodeMode triggerMode="2" ... />
#     可以直接运行 tools\set-trigger-mode.ps1 -Mode soft 改好（会自动备份）。
#   * 无相机/无加密狗时，把 provider 改成 simulator，同样用下面的开关就能"模拟触发一次"。
[test]
# 总开关：false 时下面的触发都不会执行
enableSoftTrigger=false
# 启动后自动触发一次（冒烟测试用）
triggerOnStart=false
# 启动后延迟多少毫秒触发
triggerDelayMs=1500
# 每隔多少毫秒自动触发一次，模拟连续过包；0 = 关闭
triggerIntervalMs=0

# ---- 测试用模拟 provider（不需要相机和加密狗）----
# 用法：把 [runtime] 的 provider 改成 simulator，然后：
#   .\run.ps1 -Duration 8 --trigger-once
[simulator]
# 模拟图片落盘目录（相对 runtime；实际写到 images\<日期>\simulator\ 下）
imageDir=images
# 模拟条码前缀，最终条码形如 TEST102233001
codePrefix=TEST
# 是否在条码事件之后再补一条"带重量体积"的事件（模拟大华两次回调）
emitEnriched=true
imageWidth=320
imageHeight=240
# 测试注入：让模拟器"拒绝"某个触发模式（soft/hard/free 或 2/1/0），留空=不注入。
# 用途：验证 tools\apply-config.ps1 的"校验失败自动回滚"——例如填 soft，
# 再执行 apply-config.ps1 -TriggerMode soft，就能看到 应用→校验失败→自动回滚→回滚后校验通过。
rejectTriggerMode=
# 让清单里第 N 台（按顺序，从 1 开始；也可以直接写 IP/序列号）显示成离线，用于验证设备信息页的离线行。
# 例：offlineCameras=3,5
offlineCameras=
