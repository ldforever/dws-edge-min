# DWS Edge Min 采集宿主配置
#
# 宿主只认 [runtime] 段和"被选中 provider 的同名配置段"；每个 provider 自己解释自己的段，
# 核心层不认识任何厂商参数。

[runtime]
# 用哪个 provider（对应 providers 目录里工厂声明的 ProviderId）
provider=dahua-dws

[dahua-dws]
# 大华 SDK 配置文件（相对 runtime 目录；GB2312 编码，由大华 SDK 读取）
cfgPath=Cfg\LogisticsBase.cfg

# 图片落盘目录（相对 runtime 目录）
imageDir=images

# 保存哪些图
saveOriginal=true
saveWaybill=true

# 是否保存"每台相机各自的图"（需要 attachAllCameraCodeInfo=true，磁盘 I/O 会明显增加）
savePerCamera=false
attachAllCameraCodeInfo=false

# 回调入队缓冲：满了丢事件并告警，绝不反压 SDK 回调
queueCapacity=256

[spool]
# 规范事件写成本地 JSONL（将来换成 gRPC 推给业务层 / ARM 盒子）
enabled=true

# ---- 测试环境的软触发开关 ----
# 说明：
#   * 真机（provider=dahua-dws）要先把 SDK 配置改成软触发模式：
#       <ReadCodeMode triggerMode="2" ... />
#     可以直接运行 tools\set-trigger-mode.ps1 -Mode soft 改好（会自动备份）。
#   * 无相机/无加密狗时，把 provider 改成 simulator，同样用下面的开关就能"模拟触发一次"。
[test]
# 总开关：false 时下面的触发都不会执行
enableSoftTrigger=false
# 启动后自动触发一次（冒烟测试用）
triggerOnStart=false
# 启动后延迟多少毫秒触发
triggerDelayMs=1500
# 每隔多少毫秒自动触发一次，模拟连续过包；0 = 关闭
triggerIntervalMs=0

# ---- 测试用模拟 provider（不需要相机和加密狗）----
# 用法：把 [runtime] 的 provider 改成 simulator，然后：
#   .\run.ps1 -Duration 8 --trigger-once
[simulator]
# 模拟图片落盘目录（相对 runtime；实际写到 images\<日期>\simulator\ 下）
imageDir=images
# 模拟条码前缀，最终条码形如 TEST102233001
codePrefix=TEST
# 是否在条码事件之后再补一条"带重量体积"的事件（模拟大华两次回调）
emitEnriched=true
imageWidth=320
imageHeight=240
